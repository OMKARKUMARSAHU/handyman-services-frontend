# PHASE R (Staff/Admin login): nginx is EB's front-end reverse proxy on
# port 80, forwarding to the Node app on 8080. A successful Admin/Provider
# login now makes several sequential outbound calls from the Node process
# to Cognito (ListUsers, InitiateAuth, RespondToAuthChallenge) plus a
# first-ever JWKS fetch for this process's lifetime (aws-jwt-verify builds
# its verifier lazily and fetches the pool's JWKS on the very first
# .verify() call) -- all before the Node app can send any response back to
# nginx. A production attempt against this exact route came back as
# nginx's own generic "502 Bad Gateway" page (confirmed from the browser's
# Network tab: Content-Type text/html, nginx's stock error body), which
# means nginx gave up waiting on the Node app for THIS request specifically
# -- plain customer login and GET /me (neither of which makes more than
# one Cognito call, and neither of which was broken) both still work fine.
# This raises the platform's default proxy timeouts so a slow-but-eventually-
# successful chain of AWS calls has room to finish instead of being cut off
# by nginx. It does not touch the Security Group, load balancer, listener,
# or any networking already confirmed working -- this is purely how long
# nginx waits for its own upstream (the Node app on the same instance).
proxy_connect_timeout 75s;
proxy_send_timeout 75s;
proxy_read_timeout 75s;
