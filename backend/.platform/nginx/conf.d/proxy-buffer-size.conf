# PHASE R (Staff/Admin login) -- CONFIRMED root cause via EB application
# logs: "upstream sent too big header while reading response header from
# upstream" on POST /api/v1/auth/admin-provider/login. nginx is EB's
# front-end reverse proxy on port 80, forwarding to the Node app on 8080;
# by default it only allocates a small fixed buffer for the upstream's
# RESPONSE headers. A successful Admin/Provider login's response carries
# three Set-Cookie headers (hs_at, hs_rt, hs_client -- see
# backend/src/modules/auth/cookies.ts), and hs_rt in particular holds a
# Cognito refresh token, which is a long opaque string (easily 1-2KB on
# its own). Add the usual helmet security headers and CORS headers on top
# of three full Set-Cookie headers, and the total response header size
# for THIS route alone exceeds nginx's default proxy_buffer_size/
# proxy_buffers -- which is exactly why only Admin/Provider login breaks
# while customer login, GET /me, and every other (cookie-light or
# cookie-free) route are unaffected. Raising these buffer sizes is the
# actual fix; nothing here touches the Security Group, load balancer, or
# any networking already confirmed working, and does not change what
# cookies are set or how.
proxy_buffer_size 16k;
proxy_buffers 4 16k;
proxy_busy_buffers_size 32k;
